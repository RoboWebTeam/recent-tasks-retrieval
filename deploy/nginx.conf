# Какие разделы закрыть от индексации заголовком. Смотрим на ИСХОДНЫЙ адрес запроса
# ($request_uri), а не на $uri: try_files делает внутреннее перенаправление на index.html,
# после которого $uri уже равен /index.html, а add_header из первой локации не переносится
# в ту, что реально отдаёт ответ. Пустое значение = заголовок не добавляется.
map $request_uri $rw_robots_tag {
    default "";
    "~^/(dashboard|builder|admin|leads|files|analytics|settings|order-status|auth)([/?]|$)" "noindex, nofollow";
    "~^/site/" "noindex, nofollow";
}

# HTTP: домен roboweb.dev редиректим на HTTPS; по IP (default_server _) продолжаем отдавать сайт
# по HTTP (у IP нет валидного сертификата). ACME-челлендж всегда доступен для выпуска/продления.
server {
    listen 80;
    server_name roboweb.dev www.roboweb.dev;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Robots-Tag $rw_robots_tag always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 900s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Приватные разделы не должны попадать в поиск. robots.txt лишь просит не обходить —
    # он НЕ запрещает индексацию, а этот заголовок запрещает, и работает без JS.
    location ~ ^/(dashboard|builder|admin|leads|files|analytics|settings|order-status|auth)(/|$) {
        try_files $uri /index.html;
    }

    # Проекты клиентов: чужой контент не должен индексироваться на основном домене — иначе
    # репутация roboweb.dev складывается из сотен чужих тематик. Обход при этом РАЗРЕШЁН,
    # чтобы робот увидел заголовок и убрал из индекса уже проиндексированное.
    location ^~ /site/ {
        try_files $uri /index.html;
    }

    # Старый адрес статьи с кириллицей внутри латинского слага.
    location = /blog/kak-sozd%D0%B0%D1%82%D1%8C-sajt-za-5-minut {
        return 301 https://roboweb.dev/blog/kak-sozdat-sajt-za-5-minut;
    }

    # Хеши в именах файлов сборки — содержимое по адресу не меняется никогда.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    # Карта сайта и robots должны обновляться у робота быстро.
    location ~* ^/(robots\.txt|sitemap.*\.xml)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    # Разделы приложения, которые не пререндерятся (кабинет, редактор, вход, статусы, проекты
    # клиентов) — им отдаём каркас, приложение отрисует их само.
    location ~ ^/(login|site|en)(/|$) {
        try_files $uri /index.html;
    }

    # Всё остальное: сначала готовый пререндеренный файл, затем ЧЕСТНЫЙ 404.
    # Раньше здесь стоял безусловный откат на index.html, из-за чего ЛЮБОЙ несуществующий адрес
    # отдавал код 200 с содержимым главной — бесконечный источник дублей для поисковика.
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;
}

# HTTPS. Сертификат берётся из тома certbot_certs. До выпуска реального — там лежит самоподписанный
# dummy (создаёт сервис certbot-init), поэтому nginx стартует всегда и не падает без сертификата.
# Зеркало www: раньше www.roboweb.dev отдавал сайт с кодом 200, то есть весь сайт существовал
# в двух копиях. Склеиваем постоянным редиректом на основной домен.
server {
    listen 443 ssl;
    http2 on;
    server_name www.roboweb.dev;
    ssl_certificate     /etc/letsencrypt/live/roboweb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roboweb.dev/privkey.pem;
    return 301 https://roboweb.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # ВАЖНО: `_` здесь ловит и подключённые домены клиентов — их редиректить нельзя.
    server_name roboweb.dev _;

    ssl_certificate     /etc/letsencrypt/live/roboweb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roboweb.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

